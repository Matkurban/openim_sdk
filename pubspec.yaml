name: openim_sdk
description: An instant messaging plug-in that supports Android, iOS, macOS, Windows, Linux, and Web. And the server is also all open source.
version: 3.0.0
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/openim_sdk
topics: [openim, im, sdk, flutter]

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  dio: ^5.11.1
  path: ^1.9.1
  crypto: ^3.0.8
  fixnum: ^1.1.1
  logging: ^1.3.0
  tostore: ^3.6.3
  protobuf: ^6.1.0
  equatable: ^3.0.0
  path_provider: ^2.1.6
  protoc_plugin: ^25.1.0
  json_annotation: ^4.12.0
  universal_platform: ^1.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
