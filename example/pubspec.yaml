name: openim_sdk_example
description: "Full-featured WeChat-style cross-platform IM example for OpenIM SDK."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Core IM SDK, HTTP, Event Bus & Logging
  openim_sdk:
    path: ../
  dio: ^5.7.0
  rxdart: ^0.28.0
  logging: ^1.3.0

  # 1. 基础架构与交互
  xue_hua_adaptive_sliding_layout: ^3.6.3
  signal_wire: ^1.0.0
  flutter_toast_pro: ^4.1.2
  chat_context_menu: ^4.2.0
  contact_list_view: ^2.1.0
  xue_hua_animated_svg: ^1.3.0

  # 2. 音视频与媒体处理
  xue_hua_navite_video_player: ^2.8.0
  xue_hua_audio: ^3.0.0
  xue_hua_navite_volume_controller: ^1.0.0
  xue_hua_media_compression: ^2.4.0
  xue_hua_media_info: ^2.2.0

  # 3. 文件、缓存与工具
  xue_hua_navite_cache_manager: ^1.3.0
  xue_hua_file_operations: ^1.6.0
  xue_hua_navite_background_downloader: ^1.0.9
  xue_hua_navite_clipboard: ^1.1.0
  xue_hua_barcode_scanner: ^1.3.0
  xue_hua_qr_code: ^2.0.3
  xue_hua_navite_share: ^1.0.7
  xue_hua_navite_accept_sharing: ^1.0.9

  # 4. 设备、安全与桌面端增强
  xue_hua_device_info: ^2.1.0
  xue_hua_screen_protection: ^1.1.0
  xue_hua_app_badge: ^2.1.9
  xue_hua_navite_window_manager: ^1.1.0
  xue_hua_navite_drag_drop: ^1.0.9
  xue_hua_navite_system_tray: ^1.0.9
  xue_hua_navite_auto_update: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/svg/
